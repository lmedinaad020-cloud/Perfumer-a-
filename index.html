<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALPHA Perfumes y Decants</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --night: #031a34;
      --navy: #062647;
      --surface: #0b3156;
      --surface-soft: #0d3a63;
      --border: rgba(226, 177, 86, .27);
      --gold: #c99036;
      --gold-light: #f1c36d;
      --ivory: #f6f0e7;
      --muted: #b8c6d5;
      --success: #85b88f;
      --danger: #d99076;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px 16px 40px; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ivory); background: radial-gradient(circle at 50% -10%, #124a76 0, var(--night) 42%, #021326 100%); }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .16; background-image: linear-gradient(90deg, transparent 49%, rgba(241,195,109,.15) 50%, transparent 51%); background-size: 84px 84px; }
    .app-shell { position: relative; width: min(100%, 900px); margin: auto; }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .brand img { width: 148px; height: 148px; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 10px 22px rgba(0,0,0,.32)); }
    .brand-name { margin: -2px 0 2px; font-family: Georgia, serif; font-weight: 500; font-size: clamp(1.55rem, 4vw, 2.15rem); letter-spacing: .38em; padding-left: .38em; color: var(--ivory); }
    .brand-tagline { margin: 0; color: var(--gold-light); font-family: Georgia, serif; letter-spacing: .11em; font-size: .78rem; }
    .gold-rule { width: min(310px, 84%); height: 1px; margin: 14px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .header { padding: 0 0 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .header .brand { align-items: flex-start; text-align: left; }
    .header .brand img { width: 70px; height: 70px; position: absolute; left: 0; top: -4px; }
    .header .brand-name { font-size: 1.3rem; margin-left: 80px; }
    .header .brand-tagline { margin-left: 80px; }
    .header .gold-rule { width: 100%; margin-top: 14px; }
    .card { background: linear-gradient(145deg, rgba(13,58,99,.96), rgba(5,35,65,.96)); border: 1px solid var(--border); box-shadow: 0 16px 36px rgba(0,0,0,.22); border-radius: 14px; padding: 22px; margin-top: 16px; }
    .login-card { max-width: 440px; margin: 30px auto 0; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: .75rem; letter-spacing: .05em; margin-bottom: 6px; color: var(--gold-light); }
    input, select { width: 100%; padding: 11px 12px; border-radius: 7px; border: 1px solid rgba(246,240,231,.22); outline: none; background: rgba(2,19,38,.52); color: var(--ivory); font: inherit; }
    input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,144,54,.16); }
    button { width: 100%; padding: 12px 14px; background: linear-gradient(135deg, #dba648, #ae7628); color: #fffaf0; border: 1px solid #efc66e; border-radius: 7px; font: 700 .87rem inherit; letter-spacing: .02em; cursor: pointer; margin-top: 8px; transition: transform .15s, filter .15s; }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button.btn-sec { background: transparent; border-color: rgba(246,240,231,.3); color: var(--muted); }
    button.btn-add { width: auto; margin: 0; padding: 8px 11px; background: linear-gradient(135deg, #5e986c, #3d7452); border-color: #8fc49a; font-size: .75rem; }
    button.btn-open { width: auto; margin: 0; padding: 8px 11px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: #60a5fa; font-size: .75rem; color: #fff; }
    button.btn-empty { width: auto; margin: 0; padding: 8px 11px; background: linear-gradient(135deg, #b85c5c, #8a3636); border-color: #d99076; font-size: .75rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: .68rem; background: rgba(201,144,54,.16); border: 1px solid rgba(241,195,109,.35); color: var(--gold-light); }
    .price { color: var(--gold-light); font-weight: 700; }
    .hidden { display: none !important; }
    .nav-tabs { display: flex; gap: 9px; margin: 0 0 16px; }
    .nav-tabs button { flex: 1; margin: 0; background: rgba(11,49,86,.82); border-color: var(--border); color: var(--ivory); font-size: .78rem; }
    .nav-tabs button:hover { border-color: var(--gold); }
    .stock-item { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 14px; margin-top: 9px; background: rgba(2,19,38,.28); border-radius: 9px; border: 1px solid rgba(246,240,231,.09); }
    .stock-actions { display: flex; gap: 6px; flex-direction: column; align-items: flex-end; }
    h2, h3, h4 { color: var(--ivory); } h3 { margin-top: 0; font-family: Georgia, serif; font-weight: 500; letter-spacing: .04em; }
    p { color: var(--muted); } #userLogged { color: var(--gold-light) !important; }
    @media (max-width: 520px) { body { padding: 16px 11px 30px; } .card { padding: 17px; } .grid-2 { grid-template-columns: 1fr; gap: 0; } .nav-tabs { gap: 5px; } .nav-tabs button { padding: 10px 5px; font-size: .68rem; } .stock-item { align-items: flex-start; flex-direction: column; } .stock-actions { flex-direction: row; width: 100%; justify-content: space-between; margin-top: 8px; flex-wrap: wrap; } .header .brand img { width: 58px; height: 58px; } .header .brand-name, .header .brand-tagline { margin-left: 65px; } }
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="sec-login" class="card login-card">
      <div class="brand"><img src="assets/alpha-logo.jpeg" alt="Alpha Perfumes y Decants"><h1 class="brand-name">VENTAS</h1><p class="brand-tagline">PLATAFORMA</p><div class="gold-rule"></div></div>
      <p style="text-align:center; margin:22px 0 16px;">Iniciar sesión</p>
      <form id="formLogin">
        <div class="form-group"><label>Correo electrónico</label><input type="email" id="loginEmail" placeholder="usuario@email.com" required></div>
        <div class="form-group"><label>Contraseña</label><input type="password" id="loginPass" placeholder="••••••••" required></div>
        <button type="submit">Ingresar</button>
      </form>
    </section>

    <section id="sec-app" class="hidden">
      <header class="header">
        <div class="brand"><img src="assets/alpha-logo.jpeg" alt="Alpha"><h1 class="brand-name">ALPHA</h1><p class="brand-tagline">PERFUMES Y DECANTS</p><div class="gold-rule"></div></div>
        <p id="userLogged" style="margin:12px 0 0; font-size:.8rem;"></p>
        <button onclick="cerrarSesion()" class="btn-sec" style="padding:6px 10px;font-size:.72rem;width:auto;margin-top:7px;">Cerrar sesión</button>
      </header>

      <nav class="nav-tabs">
        <button onclick="mostrarTab('venta')">🛒 Vender</button>
        <button onclick="mostrarTab('stock')">📦 Inventario</button>
        <button onclick="mostrarTab('historial')">📊 Historial</button>
      </nav>

      <!-- TAB VENTA -->
      <div id="tab-venta" class="card">
        <h3>🛒 Nueva venta</h3>
        <form id="formVenta">
          <div class="form-group">
            <label>Tipo de venta</label>
            <select id="vtaTipo" onchange="actualizarOpcionesVenta()">
              <option value="Perfume Sellado">Perfume Sellado</option>
              <option value="Decant">Decant (Fraccionado)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Seleccionar perfume</label>
            <select id="vtaPerfume" required></select>
          </div>
          <div id="grpTamano" class="form-group hidden">
            <label>Tamaño de decant vendido</label>
            <select id="vtaTamano">
              <option value="3ml">3ml</option>
              <option value="5ml">5ml</option>
              <option value="10ml">10ml</option>
            </select>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>Precio cobrado (S/)</label>
              <input type="number" step="0.01" id="vtaMonto" placeholder="Ej: 25.00" required>
            </div>
            <div class="form-group">
              <label>Método de pago</label>
              <select id="vtaMetodoPago">
                <option value="Efectivo">Efectivo</option>
                <option value="Yape">Yape / Plin</option>
                <option value="Tarjeta">Tarjeta</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Canal de venta</label>
            <select id="vtaCanal">
              <option value="Tienda Local">Tienda Local</option>
              <option value="Alpha Móvil">Alpha Móvil</option>
              <option value="Instagram">Instagram</option>
              <option value="WhatsApp">WhatsApp</option>
              <option value="Delivery Presencial">Delivery Presencial</option>
            </select>
          </div>
          <button type="submit">Procesar venta y descontar stock</button>
        </form>
      </div>

      <!-- TAB STOCK -->
      <div id="tab-stock" class="card hidden">
        <h3>➕ Crear Nuevo Producto / Envase</h3>
        <form id="formStock">
          <div class="form-group">
            <label>Tipo de registro</label>
            <select id="stkTipo" onchange="toggleCamposStock()">
              <option value="Perfume Sellado">Perfume Sellado</option>
              <option value="Perfume para Decant">Perfume Abierto (Para Decants)</option>
              <option value="Decant Vacío">Envase Decant Vacío</option>
            </select>
          </div>
          <div class="form-group">
            <label>Nombre / descripción</label>
            <input type="text" id="stkNombre" placeholder="Ej: Sauvage EDP o Envase Atomizador" required>
          </div>
          <div id="grpTamanoVacios" class="form-group hidden">
            <label>Capacidad del envase vacío</label>
            <select id="stkTamanoVacios">
              <option value="3ml">3ml</option>
              <option value="5ml">5ml</option>
              <option value="10ml">10ml</option>
            </select>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>Precio Base (S/)</label>
              <input type="number" step="0.01" id="stkPrecio" value="0.00">
            </div>
            <div class="form-group">
              <label>Cantidad inicial</label>
              <input type="number" id="stkCantidad" value="1" required>
            </div>
          </div>
          <button type="submit">Guardar nuevo en inventario</button>
        </form>
        <h3 style="margin-top:28px;">📦 Stock actual y reposición</h3>
        <p style="font-size:.78rem;">Usa el botón azul para abrir un perfume sellado y pasar 1 unidad a Decants.</p>
        <div id="listaStock">Cargando...</div>
      </div>

      <!-- TAB HISTORIAL -->
      <div id="tab-historial" class="card hidden">
        <h3>📊 Historial de ventas</h3>
        <div id="listaVentas">Cargando ventas...</div>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://zmvuueizrehqibjjcbgd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdnV1ZWl6cmVocWliampjYmdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTY0MDMsImV4cCI6MjEwNTMzMjQwM30.HVgy61_hS7ecm7sHMz2h5mKtb7r1LXesIjfoH5lZG8M';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 🔒 CORREOS AUTORIZADOS PARA VER PRECIO BASE
    const ADMIN_EMAILS = [
      'diego@alpha.com',
      'luis@alpha.com',
      'mau@alpha.com'
    ];

    let usuarioActual = null;
    let listaProductos = [];

    function esAdmin() {
      return usuarioActual && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(usuarioActual.email.toLowerCase());
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPass').value;
      
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) alert('Error al ingresar: ' + error.message);
      else {
        usuarioActual = data.user;
        iniciarApp();
      }
    });

    function iniciarApp() {
      document.getElementById('sec-login').classList.add('hidden');
      document.getElementById('sec-app').classList.remove('hidden');
      document.getElementById('userLogged').innerText = `Usuario: ${usuarioActual.email} ${esAdmin() ? ' (ADMIN)' : ''}`;
      cargarTodo();
    }

    async function cerrarSesion() {
      await client.auth.signOut();
      location.reload();
    }

    function mostrarTab(tab) {
      ['venta', 'stock', 'historial'].forEach(t => document.getElementById(`tab-${t}`).classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
    }

    async function cargarTodo() {
      const { data: prods } = await client.from('productos').select('*').order('id', { ascending: false });
      listaProductos = prods || [];
      renderizarStock();
      actualizarOpcionesVenta();
      cargarHistorial();
    }

    function toggleCamposStock() {
      const stkTipoVal = document.getElementById('stkTipo').value;
      document.getElementById('grpTamanoVacios').classList.toggle('hidden', stkTipoVal !== 'Decant Vacío');
    }

    function renderizarStock() {
      const contenedor = document.getElementById('listaStock');
      if (!listaProductos.length) {
        contenedor.innerHTML = '<p>Sin productos registrados.</p>';
        return;
      }
      contenedor.innerHTML = listaProductos.map(p => {
        const esSellado = p.tipo === 'Perfume Sellado';
        const esAgotable = p.tipo === 'Perfume para Decant' || p.tipo === 'Decant Vacío';
        
        return `
        <div class="stock-item">
          <div>
            <span class="badge">${p.tipo} ${p.tamano ? `(${p.tamano})` : ''}</span>
            <h4 style="margin:7px 0 3px;">${p.nombre}</h4>
            
            ${esAdmin() ? `<p class="price" style="margin:0;font-size:.8rem;">Precio Base: S/ ${p.precio}</p>` : ''}
            
            <p style="margin:3px 0 0;font-size:.8rem;">Disponible: <strong>${p.stock} unids.</strong> ${p.stock === 0 ? '<span style="color:var(--danger); font-weight:bold;">(VACÍO / AGOTADO)</span>' : ''}</p>
          </div>
          <div class="stock-actions">
            <button onclick="sumarStock(${p.id}, ${p.stock})" class="btn-add">➕ Sumar stock</button>
            
            <!-- Botón para abrir perfume sellado -->
            ${esSellado && p.stock > 0 ? `<button onclick="abrirPerfumeSellado(${p.id})" class="btn-open">🍾 Abrir p/ Decant</button>` : ''}
            
            <!-- Botón para descontar 1 unidad agotada -->
            ${esAgotable && p.stock > 0 ? `<button onclick="marcarComoVacio(${p.id}, '${p.nombre.replace(/'/g, "\\'")}', ${p.stock})" class="btn-empty">🚫 Marcar 1 vacío</button>` : ''}
          </div>
        </div>
      `}).join('');
    }

    // 🍾 ABRIR PERFUME SELLADO (Sincronización garantizada por ID de Supabase)
    async function abrirPerfumeSellado(idSellado) {
      const perfumeSelladoObj = listaProductos.find(p => p.id === idSellado);
      if (!perfumeSelladoObj || perfumeSelladoObj.stock < 1) return alert('No hay stock disponible para abrir.');

      const confirmar = confirm(`¿Deseas ABRIR 1 frasco sellado de "${perfumeSelladoObj.nombre}"?\n\n- Se descontará 1 unidad de Perfumes Sellados.\n- Se sumará 1 unidad a "Perfume para Decant".`);
      if (!confirmar) return;

      // 1. Descontar inmediatamente en la base de datos de Supabase por ID
      const nuevoStockSellado = perfumeSelladoObj.stock - 1;
      const { error: err1 } = await client.from('productos').update({ stock: nuevoStockSellado }).eq('id', idSellado);
      
      if (err1) {
        return alert('Error al actualizar stock sellado: ' + err1.message);
      }

      // 2. Buscar o crear el registro en "Perfume para Decant"
      const perfumeAbiertoObj = listaProductos.find(p => p.tipo === 'Perfume para Decant' && p.nombre.toLowerCase() === perfumeSelladoObj.nombre.toLowerCase());

      if (perfumeAbiertoObj) {
        // Si existe, le sumamos 1 unidad
        const { error: err2 } = await client.from('productos').update({ stock: perfumeAbiertoObj.stock + 1 }).eq('id', perfumeAbiertoObj.id);
        if (err2) alert('Error al sumar stock abierto: ' + err2.message);
      } else {
        // Si no existe, creamos el registro abierto
        const { error: err3 } = await client.from('productos').insert([{
          nombre: perfumeSelladoObj.nombre,
          tipo: 'Perfume para Decant',
          tamano: null,
          precio: perfumeSelladoObj.precio,
          stock: 1
        }]);
        if (err3) alert('Error al registrar nuevo perfume abierto: ' + err3.message);
      }

      alert(`¡"${perfumeSelladoObj.nombre}" se abrió correctamente! Quedan ${nuevoStockSellado} sellados.`);
      cargarTodo();
    }

    async function sumarStock(id, stockActual) {
      const cantidad = prompt('¿Cuántas unidades deseas sumar al stock existente?');
      if (!cantidad || isNaN(cantidad) || parseInt(cantidad) <= 0) return;

      const nuevoStock = stockActual + parseInt(cantidad);
      const { error } = await client.from('productos').update({ stock: nuevoStock }).eq('id', id);

      if (error) alert('Error al actualizar stock: ' + error.message);
      else {
        alert(`¡Stock actualizado! Nuevo total: ${nuevoStock} unidades.`);
        cargarTodo();
      }
    }

    // 🚫 DESCONTAR 1 UNIDAD VACÍA (REDUCIR STOCK EN 1)
    async function marcarComoVacio(id, nombre, stockActual) {
      if (stockActual <= 0) return alert(`"${nombre}" ya no tiene unidades disponibles.`);

      const confirmar = confirm(`¿Confirmas que se terminó 1 botella de "${nombre}"?\n\nStock actual: ${stockActual} ➔ Quedarán: ${stockActual - 1}`);
      if (!confirmar) return;

      const nuevoStock = stockActual - 1;
      const { error } = await client.from('productos').update({ stock: nuevoStock }).eq('id', id);

      if (error) alert('Error al actualizar: ' + error.message);
      else {
        if (nuevoStock === 0) {
          alert(`Se descontó 1 unidad. "${nombre}" ha quedado TOTALMENTE AGOTADO (0 unidades).`);
        } else {
          alert(`Se descontó 1 unidad de "${nombre}". Unidades restantes: ${nuevoStock}.`);
        }
        cargarTodo();
      }
    }

    function actualizarOpcionesVenta() {
      const vtaTipoVal = document.getElementById('vtaTipo').value;
      const isDecant = vtaTipoVal === 'Decant';
      document.getElementById('grpTamano').classList.toggle('hidden', !isDecant);
      
      const tipo = isDecant ? 'Perfume para Decant' : 'Perfume Sellado';
      const filtrados = listaProductos.filter(p => p.tipo === tipo && p.stock > 0);
      
      const selectPerfume = document.getElementById('vtaPerfume');
      if (filtrados.length === 0) {
        selectPerfume.innerHTML = `<option value="">-- Sin productos activos disponibles --</option>`;
      } else {
        selectPerfume.innerHTML = filtrados.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
      }
    }

    // CREACIÓN NUEVO PRODUCTO
    document.getElementById('formStock').addEventListener('submit', async (e) => {
      e.preventDefault();
      const tipo = document.getElementById('stkTipo').value;
      const nombreInput = document.getElementById('stkNombre').value.trim();
      const cantidadReg = parseInt(document.getElementById('stkCantidad').value) || 1;
      const precioInput = parseFloat(document.getElementById('stkPrecio').value) || 0;

      const nuevo = {
        nombre: nombreInput,
        tipo: tipo,
        tamano: tipo === 'Decant Vacío' ? document.getElementById('stkTamanoVacios').value : null,
        precio: precioInput,
        stock: cantidadReg
      };

      const { error } = await client.from('productos').insert([nuevo]);
      if (error) alert('Error: ' + error.message);
      else {
        alert('Registrado correctamente');
        document.getElementById('formStock').reset();
        toggleCamposStock();
        cargarTodo();
      }
    });

    // 🛒 REGISTRAR VENTA
    document.getElementById('formVenta').addEventListener('submit', async (e) => {
      e.preventDefault();
      const tipoVenta = document.getElementById('vtaTipo').value;
      const perfumeId = document.getElementById('vtaPerfume').value;
      const tamanoDecant = document.getElementById('vtaTamano').value;
      const monto = parseFloat(document.getElementById('vtaMonto').value);
      const canal = document.getElementById('vtaCanal').value;
      const metodoPago = document.getElementById('vtaMetodoPago').value;

      const perfumeObj = listaProductos.find(p => p.id == perfumeId);
      if (!perfumeObj) return alert('Selecciona un perfume válido.');

      if (tipoVenta === 'Perfume Sellado') {
        if (perfumeObj.stock < 1) return alert('¡No hay stock disponible de este perfume sellado!');
        
        await client.from('productos').update({ stock: perfumeObj.stock - 1 }).eq('id', perfumeObj.id);
      } else {
        const vacioObj = listaProductos.find(p => p.tipo === 'Decant Vacío' && p.tamano === tamanoDecant);
        if (!vacioObj || vacioObj.stock < 1) return alert(`¡No hay stock disponible de frascos vacíos de ${tamanoDecant}!`);

        await client.from('productos').update({ stock: vacioObj.stock - 1 }).eq('id', vacioObj.id);
      }

      const venta = {
        producto_id: perfumeObj.id,
        producto_nombre: perfumeObj.nombre,
        tipo_venta: tipoVenta,
        tamano: tipoVenta === 'Decant' ? tamanoDecant : 'Frasco Entero',
        monto_total: monto,
        vendedor_email: usuarioActual.email,
        ubicacion_venta: `${canal} (${metodoPago})`
      };

      const { error } = await client.from('ventas').insert([venta]);
      if (error) alert('Error al registrar la venta: ' + error.message);
      else {
        alert('¡Venta realizada con éxito!');
        document.getElementById('formVenta').reset();
        actualizarOpcionesVenta();
        cargarTodo();
      }
    });

    async function cargarHistorial() {
      const { data: ventas } = await client.from('ventas').select('*').order('fecha', { ascending: false });
      const contenedor = document.getElementById('listaVentas');
      if (!ventas || !ventas.length) {
        contenedor.innerHTML = '<p>No hay ventas registradas aún.</p>';
        return;
      }
      contenedor.innerHTML = ventas.map(v => `
        <div class="stock-item">
          <div>
            <p style="margin:0;font-size:.72rem;">${new Date(v.fecha).toLocaleString()}</p>
            <h4 style="margin:5px 0;">${v.producto_nombre} <span class="badge">${v.tamano}</span></h4>
            <p class="price" style="margin:0;font-size:.83rem;">Monto: S/ ${v.monto_total}</p>
            <p style="margin:4px 0 0;font-size:.72rem;">Vendido por: <strong>${v.vendedor_email}</strong> vía <strong>${v.ubicacion_venta}</strong></p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
