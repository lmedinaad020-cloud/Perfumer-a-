<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo ALPHA Perfumes y Decants</title>

  <link rel="icon" type="image/jpeg" href="assets/alpha-logo.jpeg">
  <link rel="apple-touch-icon" href="assets/alpha-logo.jpeg">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --night: #031a34;
      --navy: #062647;
      --surface: #0b3156;
      --border: rgba(226, 177, 86, .27);
      --gold: #c99036;
      --gold-light: #f1c36d;
      --ivory: #f6f0e7;
      --muted: #b8c6d5;
      --wsp-green: #25d366;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px 16px 40px; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ivory); background: radial-gradient(circle at 50% -10%, #124a76 0, var(--night) 42%, #021326 100%); }
    .app-shell { max-width: 950px; margin: auto; }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand img { width: 110px; height: 110px; border-radius: 50%; object-fit: contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.4)); }
    .brand-name { font-family: Georgia, serif; letter-spacing: .35em; font-size: 1.8rem; margin: 8px 0 2px; color: var(--ivory); }
    .brand-tagline { color: var(--gold-light); letter-spacing: .12em; font-size: 0.8rem; margin: 0; }
    .gold-rule { width: 180px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 12px auto; }
    
    .search-box { margin-bottom: 16px; }
    .search-box input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--gold); background: rgba(2,19,38,0.7); color: var(--ivory); outline: none; font-size: 0.9rem; }
    
    .inv-filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; }
    .chip-btn { flex: none; padding: 7px 16px; font-size: 0.8rem; border-radius: 999px; background: rgba(2,19,38,0.6); border: 1px solid var(--border); color: var(--ivory); cursor: pointer; }
    .chip-btn.active { background: var(--gold); color: #000; font-weight: bold; border-color: var(--gold-light); }

    .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
    .product-card { background: rgba(2,19,38,.6); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
    .product-card:hover { border-color: var(--gold); transform: translateY(-3px); }
    .product-card-img-wrapper { width: 100%; height: 160px; background: rgba(0,0,0,0.2); position: relative; }
    .product-card-img { width: 100%; height: 100%; object-fit: cover; }
    .badge-type { position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 99px; font-size: 0.65rem; background: rgba(201,144,54,0.2); border: 1px solid var(--gold-light); color: var(--gold-light); font-weight: bold; }
    .product-card-body { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .product-title { font-size: 0.95rem; font-weight: bold; margin: 0 0 6px; color: var(--ivory); }
    .product-price { font-size: 1.1rem; color: var(--gold-light); font-weight: bold; margin: 4px 0 12px; }
    
    .btn-wsp { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px; background: #25d366; color: #000; font-weight: bold; border: none; border-radius: 8px; text-decoration: none; font-size: 0.82rem; transition: filter 0.2s; }
    .btn-wsp:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="brand">
      <img src="assets/alpha-logo.jpeg" alt="Alpha Perfumes">
      <h1 class="brand-name">ALPHA</h1>
      <p class="brand-tagline">CATÁLOGO EXCLUSIVO DE PERFUMES Y DECANTS</p>
      <div class="gold-rule"></div>
    </header>

    <div class="search-box">
      <input type="text" id="inputBusqueda" placeholder="🔍 Buscar perfume por nombre..." oninput="filtrarCat()">
    </div>

    <div class="inv-filter-chips">
      <button class="chip-btn active" onclick="filtrarChip('TODOS', this)">🌐 Todos</button>
      <button class="chip-btn" onclick="filtrarChip('SELLADO', this)">🧴 Perfumes Sellados</button>
      <button class="chip-btn" onclick="filtrarChip('DECANT', this)">🧪 Decants Fraccionados</button>
    </div>

    <div id="gridCat" class="inv-grid">Cargando catálogo...</div>
  </main>

  <script>
    const SUPABASE_URL = 'https://zmvuueizrehqibjjcbgd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdnV1ZWl6cmVocWliampjYmdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTY0MDMsImV4cCI6MjEwNTMzMjQwM30.HVgy61_hS7ecm7sHMz2h5mKtb7r1LXesIjfoH5lZG8M';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const IMG_DEFAULT = 'https://static.vecteezy.com/system/resources/thumbnails/067/553/667/small/minimalist-graphic-illustration-of-a-bottle-useful-for-beauty-wellness-or-container-themes-simplicity-and-clean-design-enhance-visual-impact-vector.jpg';
    const NUMERO_WSP = '51999999999'; // 👈 CAMBIA ESTE NÚMERO POR TU WHATSAPP (Con código de país, ej. 51...)

    let listaProductos = [];
    let filtroActual = 'TODOS';

    async function cargarCatalogo() {
      const { data } = await client.from('productos')
        .select('*')
        .gt('stock', 0)
        .neq('tipo', 'Decant Vacío')
        .order('nombre', { ascending: true });

      listaProductos = data || [];
      renderizar();
    }

    function filtrarCat() {
      renderizar();
    }

    function filtrarChip(cat, btn) {
      filtroActual = cat;
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderizar();
    }

    function renderizar() {
      const query = document.getElementById('inputBusqueda').value.toLowerCase().trim();
      let filtrados = listaProductos.filter(p => p.nombre.toLowerCase().includes(query));

      if (filtroActual === 'SELLADO') filtrados = filtrados.filter(p => p.tipo === 'Perfume Sellado');
      else if (filtroActual === 'DECANT') filtrados = filtrados.filter(p => p.tipo === 'Perfume para Decant');

      const cont = document.getElementById('gridCat');
      if (!filtrados.length) {
        cont.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:var(--muted); padding:30px;">No hay productos disponibles por el momento.</p>';
        return;
      }

      cont.innerHTML = filtrados.map(p => {
        const tamanoStr = p.tamano || '100ml';
        const pvp = parseFloat(p.precio_sugerido || 0).toFixed(2);
        const mensajeWsp = encodeURIComponent(`Hola ALPHA Perfumes, estoy interesado en consultar sobre: ${p.nombre} (${tamanoStr}).`);

        return `
          <div class="product-card">
            <div class="product-card-img-wrapper">
              <img src="${p.imagen_url || IMG_DEFAULT}" class="product-card-img" alt="${p.nombre}" onerror="this.src='${IMG_DEFAULT}'">
              <span class="badge-type">${p.tipo === 'Perfume Sellado' ? `SELLADO (${tamanoStr})` : `DECANT DE ${tamanoStr}`}</span>
            </div>
            <div class="product-card-body">
              <div>
                <h3 class="product-title">${p.nombre}</h3>
                <div class="product-price">S/ ${pvp}</div>
              </div>
              <a href="https://wa.me/${NUMERO_WSP}?text=${mensajeWsp}" target="_blank" class="btn-wsp">
                📲 Consultar por WhatsApp
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    cargarCatalogo();
  </script>
</body>
</html>
